# ---------------------------------------------------------------------------
# Integração continua: o mesmo comando que o desenvolvedor roda localmente.
#
# `mvn verify` executa testes unitários, testes de integração com Testcontainers
# e o gate de cobertura. Não existe um "comando especial de CI" que passe onde o
# local falha, nem o contrario.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # O wrapper usa distributionType=only-script, então baixa o Maven a cada
      # execução. Sem cache, uma indisponibilidade momentânea do repositorio
      # derruba o build por motivo que nada tem a ver com o código — foi o que
      # aconteceu e motivou este passo.
      - name: Cache da distribuicao do Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      - name: Build, testes e gate de cobertura
        # O runner do GitHub já tem Docker, então o Testcontainers sobe o
        # PostgreSQL real sem nenhum serviço declarado no workflow.
        run: ./mvnw -B verify

      - name: Publicar relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: target/site/jacoco/
          retention-days: 7

      - name: Gerar Javadoc
        run: ./mvnw -B javadoc:javadoc
