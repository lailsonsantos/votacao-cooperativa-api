# ---------------------------------------------------------------------------
# Perfil de teste. A URL do banco é injetada em tempo de execução pelo
# Testcontainers; aqui ficam apenas os ajustes de comportamento.
# ---------------------------------------------------------------------------
spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    clean-disabled: false

app:
  callback:
    base-url: http://localhost:8080
  sessao:
    duracao-padrao-minutos: 1
  user-info:
    enabled: false
    base-url: http://localhost:0

logging:
  level:
    br.com.cooperativa.votacao: INFO
    org.testcontainers: WARN
    com.github.dockerjava: WARN
