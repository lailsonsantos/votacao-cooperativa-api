spring:
  datasource:
    url: jdbc:h2:mem:votacao;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    locations: classpath:db/migration

app:
  user-info:
    # Desligada por padrão no perfil local. Ligue com APP_USER_INFO_ENABLED=true.
    enabled: false

logging:
  level:
    br.com.cooperativa.votacao: DEBUG
