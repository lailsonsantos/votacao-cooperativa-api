# ---------------------------------------------------------------------------
# Perfil "prod": PostgreSQL gerenciado e log estruturado em JSON.
#
# O buildpack Java da Heroku exporta JDBC_DATABASE_URL / _USERNAME / _PASSWORD
# a partir do DATABASE_URL do add-on. Consumir essas variaveis evita ter que
# converter a URI postgres:// para o formato JDBC dentro da aplicacao.
# ---------------------------------------------------------------------------
spring:
  datasource:
    url: ${JDBC_DATABASE_URL:${SPRING_DATASOURCE_URL}}
    username: ${JDBC_DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:}}
    password: ${JDBC_DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
    hikari:
      # Dimensionado para nao transformar o pool em gargalo sob a carga da
      # Tarefa Bonus 2, respeitando o limite de conexoes do plano do banco.
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 3000
  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 50

logging:
  config: classpath:logback-json.xml
