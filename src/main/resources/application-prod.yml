# ---------------------------------------------------------------------------
# Perfil "prod".
#
# A conexão pode chegar de duas formas, e as duas funcionam sem alteração:
#
#   1. DATABASE_URL no formato URI (postgresql://usuario:senha@host:porta/banco),
#      que é como Render, Railway, Fly.io, Neon e Supabase a injetam. A conversão
#      para JDBC é feita por DatabaseUrlEnvironmentPostProcessor.
#
#   2. SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD explicitas, que tem
#      precedência sobre a anterior.
# ---------------------------------------------------------------------------
spring:
  datasource:
    hikari:
      # Dimensionado para não transformar o pool em gargalo sob a carga da
      # Tarefa Bônus 2, respeitando o limite de conexões do plano do banco.
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 3000
  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 50

logging:
  config: classpath:logback-json.xml
