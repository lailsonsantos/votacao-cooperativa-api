# ---------------------------------------------------------------------------
# Perfil "prod": PostgreSQL gerenciado e log estruturado em JSON.
#
# A conexao pode chegar de duas formas, e as duas funcionam sem alteracao:
#
#   1. DATABASE_URL no formato URI (postgresql://usuario:senha@host:porta/banco),
#      que e como Render, Railway, Fly.io, Neon e Supabase a injetam. A conversao
#      para JDBC e feita por DatabaseUrlEnvironmentPostProcessor.
#
#   2. SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD explicitas, que tem
#      precedencia sobre a anterior.
# ---------------------------------------------------------------------------
spring:
  datasource:
    hikari:
      # Dimensionado para nao transformar o pool em gargalo sob a carga da
      # Tarefa Bonus 2, respeitando o limite de conexoes do plano do banco.
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 3000
  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 50

logging:
  config: classpath:logback-json.xml
