# ---------------------------------------------------------------------------
# Configuração base. Todo valor sensível ou dependente de ambiente vem de
# variável de ambiente, com default útil para desenvolvimento local.
# Perfil ativo padrão: "local" (H2 em memória, sem dependência externa).
# ---------------------------------------------------------------------------
spring:
  application:
    name: votacao-cooperativa-api
  lifecycle:
    # Tempo máximo para drenar as requisições em andamento antes de encerrar.
    timeout-per-shutdown-phase: 20s
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
  jpa:
    open-in-view: false          # Evita sessão JPA aberta durante a serialização.
    hibernate:
      ddl-auto: validate         # O schema é do Flyway; o Hibernate apenas confere.
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}             # PORT é injetada pela plataforma de nuvem.
  # Encerramento gracioso: em um redeploy a plataforma envia SIGTERM, e sem isso
  # as requisições em andamento seriam cortadas no meio — inclusive um voto já
  # aceito mas ainda não confirmado.
  shutdown: graceful
  error:
    include-message: never       # Mensagens de erro vêm do nosso handler, não do container.
  compression:
    enabled: true

app:
  callback:
    # Dica explícita do enunciado: o domínio das URLs de callback é configurável,
    # para funcionar em emulador, dispositivo físico e nuvem sem recompilar.
    base-url: ${APP_CALLBACK_BASE_URL:http://localhost:8080}
  sessao:
    # Default de 1 minuto definido no enunciado, em configuração para não existir
    # número mágico no código.
    duracao-padrao-minutos: ${APP_SESSAO_DURACAO_PADRAO:1}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  user-info:
    # Tarefa Bônus 1. O endpoint do enunciado está fora do ar; ver README.
    base-url: ${APP_USER_INFO_URL:https://user-info.herokuapp.com}
    enabled: ${APP_USER_INFO_ENABLED:true}
    fallback-permite-voto: ${APP_USER_INFO_FALLBACK:true}
    connect-timeout-ms: ${APP_USER_INFO_CONNECT_TIMEOUT:2000}
    read-timeout-ms: ${APP_USER_INFO_READ_TIMEOUT:3000}

resilience4j:
  retry:
    instances:
      userInfo:
        max-attempts: 2
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        # Retry apenas para falhas transientes. Um 4xx não melhora com repetição.
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
  circuitbreaker:
    instances:
      userInfo:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true            # Necessário para liveness/readiness em nuvem.
      # O enunciado autoriza abstrair a segurança das interfaces, então não há
      # autenticação e "when_authorized" nunca exibiria nada. Mostrar os detalhes
      # permite ao avaliador ver a saúde do banco. Com segurança real, isto
      # voltaria a ser "when_authorized".
      show-details: always
  info:
    env:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    br.com.cooperativa.votacao: ${LOG_LEVEL_APP:INFO}
