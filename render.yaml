# ---------------------------------------------------------------------------
# Blueprint do Render.
#
# Aplique conectando o repositorio em https://render.com > Blueprints > New.
# O Render lê este arquivo, cria o serviço e o banco, e mostra o custo antes de
# confirmar.
#
# Após o primeiro deploy, defina no painel:
#   APP_CALLBACK_BASE_URL     = a URL publica desta API
#   APP_CORS_ALLOWED_ORIGINS  = a URL publica do frontend
#
# APP_CALLBACK_BASE_URL importa mais do que parece: as URLs das telas do Anexo 1
# sao absolutas, e com o valor errado o cliente tentaria falar com o host errado.
# ---------------------------------------------------------------------------
services:
  - type: web
    name: votacao-cooperativa-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    # "starter" mantém o serviço sempre no ar. No plano "free" ele hiberna após
    # 15 minutos de inatividade e leva cerca de um minuto para voltar — tempo
    # suficiente para um avaliador concluir que a aplicação está fora do ar.
    plan: starter
    healthCheckPath: /actuator/health
    autoDeploy: true

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # O Render entrega a conexão como URI postgresql://, que o Spring não
      # consome diretamente. A conversao para JDBC e feita em tempo de
      # inicializacao por DatabaseUrlEnvironmentPostProcessor.
      - key: DATABASE_URL
        fromDatabase:
          name: votacao-banco
          property: connectionString

      # O plano starter oferece 512 MB. Sem limitar a heap, a JVM enxerga a
      # memória do host e o container é encerrado por OOM sob carga.
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70 -XX:+UseContainerSupport -Xss512k

      # O plano de banco tem poucas conexões disponiveis; um pool maior do que
      # elas só troca um gargalo por um erro de conexão recusada.
      - key: DB_POOL_MAX
        value: "5"

      # Tarefa Bônus 1: o serviço de CPF do enunciado está fora do ar desde o
      # encerramento do plano gratuito da Heroku.
      - key: APP_USER_INFO_ENABLED
        value: "false"

      - key: APP_SESSAO_DURACAO_PADRAO
        value: "1"

      # Preenchidas no painel após o primeiro deploy, quando as URLs existem.
      - key: APP_CALLBACK_BASE_URL
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false

databases:
  - name: votacao-banco
    databaseName: votacao
    user: votacao
    region: oregon
    postgresMajorVersion: "16"
    # ATENÇÃO: o plano gratuito de banco do Render expira 30 dias após a criação,
    # com 14 dias de carencia antes da exclusao definitiva dos dados. E suficiente
    # para uma avaliacao; para uso prolongado, troque por "basic-256mb".
    plan: free
